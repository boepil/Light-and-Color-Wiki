<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Light to Color</title>
<style>
  :root {
    --bg: #030305;
    --ink: #eeeeec;
    --muted: #8b8b96;
    --faint: #4c4c57;
    --line: #25252d;
    --tab: #121219;
    --amber: #f2c14e;
    --blue: #3c74ff;
    --green: #49c85f;
    --red: #ee4c42;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .journey { width: min(1200px, 100%); margin: 0 auto; padding: 14px 14px 24px; }
  .scene-frame { position: relative; width: 100%; }
  #scene { display: block; width: 100%; height: auto; overflow: visible; }

  .stage-tab { fill: var(--tab); }
  .stage-label, .svg-mono { font-family: var(--mono); letter-spacing: 1.5px; }
  .stage-label { fill: var(--ink); font-size: 10px; font-weight: 700; }
  .svg-muted { fill: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 1px; }
  .svg-faint { fill: var(--faint); font-family: var(--mono); font-size: 8px; }
  .axis-line { stroke: var(--line); stroke-width: 1; }

  .pigment-control {
    position: absolute;
    left: 9.8%;
    top: 89.5%;
    width: 21%;
    color: var(--muted);
    pointer-events: auto;
  }
  .pigment-control .control-label {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 7px;
    font: 9px/1.2 var(--mono);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .pigment-control .control-label span:last-child { color: var(--ink); }
  input[type="range"] {
    display: block;
    width: 100%;
    height: 4px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 3px;
    outline: none;
    background: linear-gradient(90deg, #7b4b9e 0%, #4a90d9 26%, #21d0c3 42%, #4bb35e 58%, #e0c33e 76%, #e0483e 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border: 0;
    border-radius: 50%;
    background: #f0f0ec;
    box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: 0;
    border-radius: 50%;
    background: #f0f0ec;
    box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    cursor: pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px #030305, 0 0 0 5px var(--ink); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px #030305, 0 0 0 5px var(--ink); }

  @media (max-width: 700px) {
    .journey { padding: 5px 5px 12px; }
    .pigment-control { left: 9.8%; top: 89.5%; width: 21%; }
    .pigment-control .control-label { font-size: 7px; letter-spacing: .6px; margin-bottom: 5px; }
  }
</style>
</head>
<body>
<main class="journey" aria-label="Interactive light to color journey">
  <div class="scene-frame">
    <svg id="scene" viewBox="0 0 1200 410" role="img" aria-labelledby="sceneTitle sceneDesc" preserveAspectRatio="xMidYMid meet">
      <title id="sceneTitle">From light to color</title>

      <defs id="svgDefs">

        <text class="stage-label" x="866" y="55" text-anchor="middle">OPPONENT CELLS</text>
        <text class="stage-label" x="1058" y="55" text-anchor="middle">VISUAL CORTEX</text>
      </g>

      </g>

      <ellipse cx="468" cy="276" rx="13" ry="31" fill="#e8e4d8" opacity=".95" aria-hidden="true"/>

        <circle cx="657" cy="276" r="137" fill="none" stroke="#dddddd" stroke-width="2.5"/>
        <path d="M520,276 C548,276 548,239 573,239" fill="none" stroke="#1c2430" stroke-width="1"/>
        <path d="M520,276 C548,276 548,276 573,276" fill="none" stroke="#1c2430" stroke-width="1"/>
        <path d="M520,276 C548,276 548,313 573,313" fill="none" stroke="#1c2430" stroke-width="1"/>
      </g>

      <g id="coneSignals" fill="none" aria-hidden="true">
        <path id="signalS" d="M514,276 C545,276 558,230 604,225" stroke="#4a90d9" stroke-width="2.8"/>
        <path id="signalM" d="M514,276 C548,276 565,276 604,276" stroke="#49c85f" stroke-width="2.8"/>
        <path id="signalL" d="M514,276 C545,276 558,322 604,327" stroke="#ee4c42" stroke-width="2.8"/>
      </g>

      <g id="cones" aria-hidden="true">
        <g id="coneS" transform="translate(638,225)">
          <path d="M-34,0 L24,-24 L24,24 Z" fill="#2556f5" stroke="#f4f3ea" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M24,-10 L46,-10 L46,10 L24,10 Z" fill="#2556f5" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="round"/>
          <text class="svg-muted" x="54" y="4">S</text>
        </g>
        <g id="coneM" transform="translate(638,276)">
          <path d="M-34,0 L24,-24 L24,24 Z" fill="#23bd46" stroke="#f4f3ea" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M24,-10 L46,-10 L46,10 L24,10 Z" fill="#23bd46" stroke="#49c85f" stroke-width="2.4" stroke-linejoin="round"/>
          <text class="svg-muted" x="54" y="4">M</text>
        </g>
        <g id="coneL" transform="translate(638,327)">
          <path d="M-34,0 L24,-24 L24,24 Z" fill="#ec332d" stroke="#f4f3ea" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M24,-10 L46,-10 L46,10 L24,10 Z" fill="#ec332d" stroke="#ee4c42" stroke-width="2.4" stroke-linejoin="round"/>
          <text class="svg-muted" x="54" y="4">L</text>
        </g>
      </g>

      <g id="opponentInputs" fill="none" aria-hidden="true">
        <path id="byS" d="M664,225 C726,225 741,205 795,218" stroke="#4a90d9" stroke-width="2"/>
        <path id="byM" d="M664,276 C723,276 744,220 795,218" stroke="#49c85f" stroke-width="2"/>
        <path id="byL" d="M664,327 C726,327 744,237 795,218" stroke="#ee4c42" stroke-width="2"/>
        <path id="rgS" d="M664,225 C726,225 747,274 795,276" stroke="#4a90d9" stroke-width="2"/>
        <path id="rgM" d="M664,276 C726,276 747,276 795,276" stroke="#49c85f" stroke-width="2"/>
        <path id="rgL" d="M664,327 C726,327 747,278 795,276" stroke="#ee4c42" stroke-width="2"/>
        <path id="bwM" d="M664,276 C729,276 748,337 795,334" stroke="#49c85f" stroke-width="2"/>
        <path id="bwL" d="M664,327 C729,327 748,334 795,334" stroke="#ee4c42" stroke-width="2"/>
      </g>

      <g id="opponentCells" aria-hidden="true">
        <text class="svg-muted" x="838" y="190" text-anchor="middle">B+ · Y−</text>
        <circle id="byRing" cx="838" cy="218" r="20" fill="#0c0d12" stroke="#4a90d9" stroke-width="3"/>
        <circle id="byInner" cx="838" cy="218" r="6" fill="#f2c14e"/>

        <circle id="rgInner" cx="838" cy="276" r="6" fill="#49c85f"/>

        <text class="svg-muted" x="838" y="306" text-anchor="middle">WHITE · BLACK</text>
        <circle id="bwRing" cx="838" cy="334" r="20" fill="#0c0d12" stroke="#eeeeec" stroke-width="3"/>
        <circle id="bwInner" cx="838" cy="334" r="6" fill="#050508"/>
      </g>

      <g id="outputWaves" fill="none" aria-hidden="true">
        <path id="outputBY" d="M860,218 C900,180 916,250 948,220 C973,196 986,239 1019,254" stroke="#4a90d9" stroke-width="2.4"/>
        <path id="outputRG" d="M860,276 C899,317 916,238 948,276 C977,309 990,263 1019,282" stroke="#ee4c42" stroke-width="2.4"/>
        <path id="outputBW" d="M860,334 C901,301 916,349 950,322 C979,299 993,338 1019,305" stroke="#eeeeec" stroke-width="2.1"/>
      </g>

      <g id="brain" aria-hidden="true">
        <path d="M1024,279 C1011,240 1023,191 1056,170 C1072,149 1098,145 1117,156 C1138,145 1174,157 1188,184 C1200,206 1198,229 1190,244 C1201,264 1195,290 1177,303 C1178,327 1162,349 1137,352 C1128,371 1109,380 1092,370 C1074,380 1048,367 1043,347 C1021,332 1016,304 1024,279 Z" fill="#101219" stroke="#92929b" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="1158" cy="348" r="20" fill="#101219" stroke="#92929b" stroke-width="2.2"/>
        <path d="M1056,191 C1070,183 1084,187 1092,199 M1090,164 C1104,158 1120,163 1127,175 M1132,184 C1148,178 1164,185 1170,198 M1150,226 C1165,220 1182,225 1188,238" fill="none" stroke="#555861" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M1149,364 L1146,402 L1165,402 L1167,365" fill="#101219" stroke="#92929b" stroke-width="2.2"/>

    <div class="pigment-control" aria-label="Dominant wavelength control">
      <div class="control-label">
        <span id="wlVal">506 nm · Green</span>
      </div>
      <label for="wlSlider" style="position:absolute;left:-10000px;">Dominant wavelength in nanometers</label>
      <input id="wlSlider" type="range" min="400" max="700" step="1" value="506" aria-label="Dominant wavelength in nanometers">
    </div>
  </div>
</main>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const gauss = (x, mu, sigma) => Math.exp(-((x - mu) ** 2) / (2 * sigma * sigma));
  const CONE = { L: { mu: 564, sigma: 30 }, M: { mu: 545, sigma: 32 }, S: { mu: 430, sigma: 20 } };
  const RAYS = [420, 455, 485, 515, 550, 585, 635];
  const BASE_R = 0.035;

  function reflectance(nm, dominant) { return BASE_R + (1 - BASE_R) * gauss(nm, dominant, 38); }

  const WHITE_POINT = (() => {
    const total = { L: 0, M: 0, S: 0 };
    for (let nm = 380; nm <= 700; nm += 5) {
      total.L += gauss(nm, CONE.L.mu, CONE.L.sigma);
      total.M += gauss(nm, CONE.M.mu, CONE.M.sigma);
      total.S += gauss(nm, CONE.S.mu, CONE.S.sigma);
    }
    return total;
  })();

  function coneExcitations(dominant) {
    const result = { L: 0, M: 0, S: 0 };
    for (let nm = 380; nm <= 700; nm += 5) {
      const reflected = reflectance(nm, dominant);
      result.L += gauss(nm, CONE.L.mu, CONE.L.sigma) * reflected;
      result.M += gauss(nm, CONE.M.mu, CONE.M.sigma) * reflected;
      result.S += gauss(nm, CONE.S.mu, CONE.S.sigma) * reflected;
    }
    return { L: result.L / WHITE_POINT.L, M: result.M / WHITE_POINT.M, S: result.S / WHITE_POINT.S };
  }

  function lmsToRGB(L, M, S) {
    const X = 1.86006661 * L - 1.129771 * M + 0.219968 * S;
    const Y = 0.361122 * L + 0.638804 * M - 0.000008 * S;
    const Z = 1.089064 * S;
    const gamma = value => value <= 0.0031308 ? 12.92 * value : 1.055 * Math.pow(Math.max(value, 0), 1 / 2.4) - 0.055;
    const r = gamma(3.2406 * X - 1.5372 * Y - 0.4986 * Z);
    const g = gamma(-0.9689 * X + 1.8758 * Y + 0.0415 * Z);
    const b = gamma(0.0557 * X - 0.2040 * Y + 1.0570 * Z);
    const to255 = value => Math.round(clamp(value, 0, 1) * 255);
    return { r: to255(r), g: to255(g), b: to255(b) };
  }

  function wavelengthRGB(nm, fullBrightness = false) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else { r = 1; }
    let edge = 1;
    if (!fullBrightness && nm < 420) edge = 0.3 + 0.7 * (nm - 400) / 20;
    if (!fullBrightness && nm > 660) edge = 0.3 + 0.7 * (700 - nm) / 40;
    const tone = value => Math.round(255 * Math.pow(clamp(value * edge, 0, 1), .8));
    return { r: tone(r), g: tone(g), b: tone(b) };
  }

  const rgb = color => `rgb(${color.r},${color.g},${color.b})`;

  function hueName(nm) {
    if (nm < 450) return 'Violet';
    if (nm < 485) return 'Blue';
    if (nm < 500) return 'Cyan';
    if (nm < 565) return 'Green';
    if (nm < 590) return 'Yellow';
    if (nm < 625) return 'Orange';
    return 'Red';
  }

  function wavePath(x1, y1, x2, y2, amplitude, cycles, phase = 0) {
    const samples = 72;
    const dx = x2 - x1, dy = y2 - y1;
    const length = Math.hypot(dx, dy);
    const px = -dy / length, py = dx / length;
    let path = '';
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const offset = amplitude * Math.sin((Math.PI * 2 * cycles * t) + phase);
      const x = x1 + dx * t + px * offset;
      const y = y1 + dy * t + py * offset;
      path += `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)} `;
    }
    return path;
  }

  const byId = id => document.getElementById(id);
  const svgDefs = byId('svgDefs');
  const rayFan = byId('rayFan');
  const flickers = byId('flickers');
  const curvePlot = byId('curvePlot');

  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + .4;
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 100 + 34 * Math.cos(angle));
    line.setAttribute('y1', 145 + 34 * Math.sin(angle));
    line.setAttribute('x2', 100 + 47 * Math.cos(angle));
    line.setAttribute('y2', 145 + 47 * Math.sin(angle));
    byId('sunRays').appendChild(line);
  }

  const pigmentRays = byId('pigmentRays');
  const rayEls = RAYS.map((nm, index) => {
    const color = rgb(wavelengthRGB(nm));
    const fadeId = `fade${index}`;
    const gradient = document.createElementNS(NS, 'linearGradient');
    gradient.setAttribute('id', fadeId);
    gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
    gradient.innerHTML = `<stop offset="0%" stop-color="${color}" stop-opacity=".95"/><stop offset="50%" stop-color="${color}" stop-opacity=".65"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>`;
    svgDefs.appendChild(gradient);

    const absorbed = document.createElementNS(NS, 'path');
    absorbed.setAttribute('d', 'M210,300 L300,300');
    absorbed.setAttribute('stroke', `url(#${fadeId})`);
    absorbed.setAttribute('stroke-width', '2.2');
    absorbed.setAttribute('fill', 'none');
    pigmentRays.appendChild(absorbed);

    return { nm, absorbed, gradient };
  });

  const flowElements = [];
  function registerFlow(id, speed) {
    const element = byId(id);
    if (!element) return;
    element.setAttribute('stroke-dasharray', '6 10');
    flowElements.push({ element, speed });
  }
  ['sunStream1', 'sunStream2', 'sunStream3', 'selectedThroughPigment', 'beamToLens', 'beamIntoRetina', 'signalS', 'signalM', 'signalL', 'byS', 'byM', 'byL', 'rgS', 'rgM', 'rgL', 'bwM', 'bwL', 'outputBY', 'outputRG', 'outputBW'].forEach((id, index) => registerFlow(id, 16 + (index % 3) * 3));

  const slider = byId('wlSlider');
  const refs = {
    sunBeam: byId('sunBeam'), sunBeamGradient: byId('sunBeamGradient'),
    sunStream1: byId('sunStream1'), sunStream2: byId('sunStream2'), sunStream3: byId('sunStream3'),
    selectedThroughPigment: byId('selectedThroughPigment'), beamToLens: byId('beamToLens'), beamIntoRetina: byId('beamIntoRetina'),
    signalS: byId('signalS'), signalM: byId('signalM'), signalL: byId('signalL'),
    byS: byId('byS'), byM: byId('byM'), byL: byId('byL'), rgS: byId('rgS'), rgM: byId('rgM'), rgL: byId('rgL'), bwM: byId('bwM'), bwL: byId('bwL'),
    coneS: byId('coneS'), coneM: byId('coneM'), coneL: byId('coneL'),
    byRing: byId('byRing'), byInner: byId('byInner'), rgRing: byId('rgRing'), rgInner: byId('rgInner'), bwRing: byId('bwRing'), bwInner: byId('bwInner'),
    outputBY: byId('outputBY'), outputRG: byId('outputRG'), outputBW: byId('outputBW'), brainGlow: byId('brainGlow'), glowStart: byId('glowStart'), glowEnd: byId('glowEnd'),
    wlVal: byId('wlVal')
  };

  let state = { exc: { L: 0, M: 0, S: 0 }, rg: 0, by: 0 };

  function curveGeometry(dominant) {
    const x0 = 118, x1 = 370, y0 = 360;
    const center = (x0 + x1) / 2;
    const distanceFromCenter = Math.abs(dominant - 550) / 150;
    const halfWidth = 54 + 12 * (1 - distanceFromCenter);
    const height = 112 + 18 * (1 - distanceFromCenter);
    return { x0, x1, y0, center, halfWidth, height };
  }

  function pigmentY(nm) {
    return 332 - ((nm - 400) / 300) * 76;
  }

  function pigmentBounds(y, geometry) {
    const fraction = clamp((geometry.y0 - y) / geometry.height, .025, .995);
    const offset = geometry.halfWidth * Math.sqrt(-2 * Math.log(fraction));
    return {
      left: clamp(geometry.center - offset, geometry.x0, geometry.x1),
      right: clamp(geometry.center + offset, geometry.x0, geometry.x1)
    };
  }

  function drawCurve(dominant) {
    const geometry = curveGeometry(dominant);
    const { x0, x1, y0, center, halfWidth, height } = geometry;
    let area = `M${x0},${y0} `;
    let line = `M${x0},${y0} `;
    for (let x = x0; x <= x1; x += 3) {
      const y = y0 - height * Math.exp(-((x - center) ** 2) / (2 * halfWidth * halfWidth));
      area += `L${x.toFixed(1)},${y.toFixed(1)} `;
      line += `${x === x0 ? '' : 'L'}${x.toFixed(1)},${y.toFixed(1)} `;
    }
    area += `L${x1},${y0} Z`;
    const markerX = x0 + ((dominant - 400) / 300) * (x1 - x0);
    curvePlot.innerHTML = `<path d="${area}" fill="#926120" opacity=".34"/><path d="${line}" fill="none" stroke="#f4f3ea" stroke-width="2.2"/><line x1="${markerX.toFixed(1)}" y1="${y0 - height - 2}" x2="${markerX.toFixed(1)}" y2="${y0 + 1}" stroke="#eeeeec" stroke-width="1" stroke-dasharray="3 4" opacity=".9"/>`;
    return geometry;
  }

  function setOpacity(ids, value) {
    ids.forEach(id => refs[id].setAttribute('opacity', value.toFixed(2)));
  }

  function update() {
    const dominant = Number(slider.value);
    const exc = coneExcitations(dominant);
    const rg = exc.L - exc.M;
    const by = exc.S - (exc.L + exc.M) / 2;
    const rgN = clamp(rg * 2.4, -1, 1);
    const byN = clamp(by * 2.4, -1, 1);
    const percept = lmsToRGB(exc.L, exc.M, exc.S);
    const beamColor = rgb(wavelengthRGB(dominant));
    const outputRGColor = rgN >= 0 ? '#ee4c42' : '#49c85f';
    const outputBYColor = byN >= 0 ? '#4a90d9' : '#f2c14e';
    const valueLevel = clamp((exc.L + exc.M) / 2, 0, 1);

    state = { exc, rg: rgN, by: byN };
    const geometry = drawCurve(dominant);

    // Calculate contact bounds along the pigment curve's left slope
    const topY = pigmentY(RAYS[RAYS.length - 1]); // 635nm (top ray)
    const bottomY = pigmentY(RAYS[0]);            // 420nm (bottom ray)
    const topBounds = pigmentBounds(topY, geometry);
    const bottomBounds = pigmentBounds(bottomY, geometry);

    // Build the white beam polygon hugging the curve's left edge
    let beamPathD = `M120,132 L${topBounds.left.toFixed(1)},${topY.toFixed(1)} `;
    for (let y = topY + 8; y < bottomY; y += 8) {
      const b = pigmentBounds(y, geometry);
      beamPathD += `L${b.left.toFixed(1)},${y.toFixed(1)} `;
    }
    beamPathD += `L${bottomBounds.left.toFixed(1)},${bottomY.toFixed(1)} L116,168 Z`;
    refs.sunBeam.setAttribute('d', beamPathD);

    // Update gradient orientation to track beam direction
    refs.sunBeamGradient.setAttribute('x1', '118');
    refs.sunBeamGradient.setAttribute('y1', '150');
    refs.sunBeamGradient.setAttribute('x2', ((topBounds.left + bottomBounds.left) / 2).toFixed(1));
    refs.sunBeamGradient.setAttribute('y2', ((topY + bottomY) / 2).toFixed(1));

    // White stream flow lines inside the beam
    const midY = (topY + bottomY) / 2;
    const midBounds = pigmentBounds(midY, geometry);
    refs.sunStream1.setAttribute('d', wavePath(120, 138, topBounds.left, topY, 2.5, 3.2));
    refs.sunStream2.setAttribute('d', wavePath(124, 150, midBounds.left, midY, 2.5, 3.2));
    refs.sunStream3.setAttribute('d', wavePath(118, 162, bottomBounds.left, bottomY, 2.5, 3.2));

    // Selected dominant wavelength passing through the pigment
    const selectedY = pigmentY(dominant);
    const selectedBounds = pigmentBounds(selectedY, geometry);
    refs.selectedThroughPigment.setAttribute('d', `M${(selectedBounds.left + 1).toFixed(1)},${selectedY.toFixed(1)} L${(selectedBounds.right - 1).toFixed(1)},${selectedY.toFixed(1)}`);
    refs.selectedThroughPigment.setAttribute('stroke', beamColor);
    refs.beamToLens.setAttribute('d', wavePath(selectedBounds.right, selectedY, 450, 276, 4, 2.2 + (700 - dominant) / 300 * 2.1));
    refs.beamIntoRetina.setAttribute('d', wavePath(482, 276, 514, 276, 2.5, 1.3 + (700 - dominant) / 300));
    refs.beamToLens.setAttribute('stroke', beamColor);
    refs.beamIntoRetina.setAttribute('stroke', beamColor);

    // Horizontal spectral rays inside the pigment
    rayEls.forEach(ray => {
      const rayY = pigmentY(ray.nm);
      const bounds = pigmentBounds(rayY, geometry);
      const match = reflectance(ray.nm, dominant);
      ray.absorbed.setAttribute('d', `M${(bounds.left + 1).toFixed(1)},${rayY.toFixed(1)} L${(bounds.right - 1).toFixed(1)},${rayY.toFixed(1)}`);
      ray.absorbed.setAttribute('opacity', (.85 - .4 * match).toFixed(2));
      ray.gradient.setAttribute('x1', (bounds.left + 1).toFixed(1));
      ray.gradient.setAttribute('y1', rayY.toFixed(1));
      ray.gradient.setAttribute('x2', (bounds.right - 1).toFixed(1));
      ray.gradient.setAttribute('y2', rayY.toFixed(1));
    });

    refs.signalS.setAttribute('d', wavePath(514, 276, 604, 225, 4, 2.4));
    refs.signalM.setAttribute('d', wavePath(514, 276, 604, 276, 4, 2.4));
    refs.signalL.setAttribute('d', wavePath(514, 276, 604, 327, 4, 2.4));
    refs.signalS.setAttribute('opacity', (0.55 + 0.45 * Math.sqrt(exc.S)).toFixed(2));
    refs.signalM.setAttribute('opacity', (0.55 + 0.45 * Math.sqrt(exc.M)).toFixed(2));
    refs.signalL.setAttribute('opacity', (0.55 + 0.45 * Math.sqrt(exc.L)).toFixed(2));

    ['S', 'M', 'L'].forEach(key => {
      const value = exc[key];
      const path = refs[`cone${key}`].querySelector('path');
      path.setAttribute('fill-opacity', (0.55 + 0.45 * value).toFixed(2));
    });

    setOpacity(['byS', 'byM', 'byL'], 0.15 + 0.72 * Math.max(exc.S, exc.M, exc.L));
    setOpacity(['rgS', 'rgM', 'rgL'], 0.15 + 0.72 * Math.max(exc.S, exc.M, exc.L));
    setOpacity(['bwM', 'bwL'], 0.18 + 0.8 * valueLevel);

    refs.byRing.setAttribute('stroke', outputBYColor);
    refs.byInner.setAttribute('fill', byN >= 0 ? '#f2c14e' : '#4a90d9');
    refs.rgRing.setAttribute('stroke', outputRGColor);
    refs.rgInner.setAttribute('fill', rgN >= 0 ? '#49c85f' : '#ee4c42');
    refs.bwInner.setAttribute('fill', valueLevel > .5 ? '#eeeeec' : '#050508');

    refs.outputBY.setAttribute('stroke', outputBYColor);
    refs.outputRG.setAttribute('stroke', outputRGColor);
    refs.outputBW.setAttribute('stroke', valueLevel > .5 ? '#eeeeec' : '#777985');
    refs.outputBY.setAttribute('d', wavePath(860, 218, 1024, 265, 3 + 15 * Math.abs(byN), 2.1, byN * .8));
    refs.outputRG.setAttribute('d', wavePath(860, 276, 1024, 286, 3 + 15 * Math.abs(rgN), 2.25, rgN * .8));
    refs.outputBW.setAttribute('d', wavePath(860, 334, 1024, 306, 2 + 10 * valueLevel, 2.0, valueLevel * .6));
    refs.outputBY.setAttribute('opacity', (0.28 + 0.7 * Math.abs(byN)).toFixed(2));
    refs.outputRG.setAttribute('opacity', (0.28 + 0.7 * Math.abs(rgN)).toFixed(2));
    refs.outputBW.setAttribute('opacity', (0.25 + 0.7 * valueLevel).toFixed(2));

    const glowTint = rgb(wavelengthRGB(dominant, true));
    refs.glowStart.setAttribute('stop-color', glowTint);
    refs.glowEnd.setAttribute('stop-color', glowTint);
    refs.wlVal.textContent = `${dominant} nm · ${hueName(dominant)}`;
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(time) {
    const elapsed = time / 1000;
    flowElements.forEach(flow => flow.element.setAttribute('stroke-dashoffset', (-(elapsed * flow.speed) % 16).toFixed(1)));
    const pulse = 0.78 + 0.22 * Math.sin(elapsed * 5);
    ['S', 'M', 'L'].forEach(key => {
      const value = state.exc[key] || 0;
      const body = refs[`cone${key}`].querySelector('path');
      body.setAttribute('fill-opacity', (0.55 + 0.45 * value * pulse).toFixed(2));
    });
    refs.byInner.setAttribute('r', (5 + 9 * Math.abs(state.by) * pulse).toFixed(1));
    refs.rgInner.setAttribute('r', (5 + 9 * Math.abs(state.rg) * pulse).toFixed(1));
    refs.bwInner.setAttribute('r', (5 + 6 * ((state.exc.L + state.exc.M) / 2) * pulse).toFixed(1));
    refs.brainGlow.setAttribute('r', (24 + 24 * ((state.exc.L + state.exc.M) / 2) + 4 * Math.sin(elapsed * 3)).toFixed(1));
    requestAnimationFrame(tick);
  }

  slider.addEventListener('input', update);
  update();
  if (!reduced) requestAnimationFrame(tick);
</script>
</body>
</html>
