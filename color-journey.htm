<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Light to Color</title>
<style>
  :root {
    --bg: #030305;
    --ink: #eeeeec;
    --muted: #8b8b96;
    --faint: #4c4c57;
    --line: #25252d;
    --tab: #121219;
    --amber: #f2c14e;
    --blue: #3c74ff;
    --green: #49c85f;
    --red: #ee4c42;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .journey { width: min(1200px, 100%); margin: 0 auto; padding: 14px 14px 24px; }
  .scene-frame { position: relative; width: 100%; }
  #scene { display: block; width: 100%; height: auto; overflow: visible; }

  .stage-tab { fill: var(--tab); }
  .stage-label, .svg-mono { font-family: var(--mono); letter-spacing: 1.5px; }
  .stage-label { fill: var(--ink); font-size: 10px; font-weight: 700; }
  .svg-muted { fill: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 1px; }
  .svg-faint { fill: var(--faint); font-family: var(--mono); font-size: 8px; }
  .axis-line { stroke: var(--line); stroke-width: 1; }

  .pigment-control {
    position: absolute;
    left: 9.8%;
    top: 89.5%;
    width: 21%;
    color: var(--muted);
    pointer-events: auto;
  }
  .pigment-control .control-label {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 7px;
    font: 9px/1.2 var(--mono);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .pigment-control .control-label span:last-child { color: var(--ink); }
  input[type="range"] {
    display: block;
    width: 100%;
    height: 4px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 3px;
    outline: none;
    background: linear-gradient(90deg, #32333d 0%, #585a68 35%, #9294a4 70%, #dedfe8 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border: 0;
    border-radius: 50%;
    background: #f0f0ec;
    box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: 0;
    border-radius: 50%;
    background: #f0f0ec;
    box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    cursor: pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px #030305, 0 0 0 5px var(--ink); }
  input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px #030305, 0 0 0 5px var(--ink); }

  @media (max-width: 700px) {
    .journey { padding: 5px 5px 12px; }
    .pigment-control { left: 9.8%; top: 89.5%; width: 21%; }
    .pigment-control .control-label { font-size: 7px; letter-spacing: .6px; margin-bottom: 5px; }
  }
</style>
</head>
<body>

        <path id="rgL" d="M764,327 C792,327 792,276 804,276" stroke="#ee4c42" stroke-width="2" marker-end="url(#arrow-red)"/>
        <path id="bwL" d="M764,327 C792,327 792,334 804,334" stroke="#ee4c42" stroke-width="2" marker-end="url(#arrow-red)"/>
      </g>

        <path id="somaInputBY" d="M808,218 L862,218" fill="none" stroke="#f2c14e" stroke-width="2.2" stroke-dasharray="5 5" opacity="0.7"/>
        <text class="svg-muted" x="876" y="188" text-anchor="middle">B+ · Y−</text>

        <path d="M1024,279 C1011,240 1023,191 1056,170 C1072,149 1098,145 1117,156 C1138,145 1174,157 1188,184 C1200,206 1198,229 1190,244 C1201,264 1195,290 1177,303 C1178,327 1162,349 1137,352 C1128,371 1109,380 1092,370 C1074,380 1048,367 1043,347 C1021,332 1016,304 1024,279 Z" fill="#101219" stroke="#92929b" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="1158" cy="348" r="20" fill="#101219" stroke="#92929b" stroke-width="2.2"/>
        <path d="M1056,191 C1070,183 1084,187 1092,199 M1090,164 C1104,158 1120,163 1127,175 M1132,184 C1148,178 1164,185 1170,198 M1150,226 C1165,220 1182,225 1188,238" fill="none" stroke="#555861" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M1149,364 L1146,402 L1165,402 L1167,365" fill="#101219" stroke="#92929b" stroke-width="2.2"/>

    <div class="pigment-control" aria-label="Dominant wavelength control">

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const gauss = (x, mu, sigma) => Math.exp(-((x - mu) ** 2) / (2 * sigma * sigma));
  const CONE = { L: { mu: 564, sigma: 30 }, M: { mu: 545, sigma: 32 }, S: { mu: 430, sigma: 20 } };
  const RAYS = [420, 455, 485, 515, 550, 585, 635];
  const BASE_R = 0.035;

  function reflectance(nm, dominant) { return BASE_R + (1 - BASE_R) * gauss(nm, dominant, 38); }

  const WHITE_POINT = (() => {
    const total = { L: 0, M: 0, S: 0 };
    for (let nm = 380; nm <= 700; nm += 5) {
      total.L += gauss(nm, CONE.L.mu, CONE.L.sigma);
      total.M += gauss(nm, CONE.M.mu, CONE.M.sigma);
      total.S += gauss(nm, CONE.S.mu, CONE.S.sigma);
    }
    return total;
  })();

  const CONE_MAX = (() => {
    const max = { L: 0, M: 0, S: 0 };
    for (let dom = 380; dom <= 700; dom += 5) {
      const exc = coneExcitations(dom);
      if (exc.L > max.L) max.L = exc.L;
      if (exc.M > max.M) max.M = exc.M;
      if (exc.S > max.S) max.S = exc.S;
    }
    return max;
  })();

  function coneExcitations(dominant) {
    const result = { L: 0, M: 0, S: 0 };
    for (let nm = 380; nm <= 700; nm += 5) {
      const reflected = reflectance(nm, dominant);
      result.L += gauss(nm, CONE.L.mu, CONE.L.sigma) * reflected;
      result.M += gauss(nm, CONE.M.mu, CONE.M.sigma) * reflected;
      result.S += gauss(nm, CONE.S.mu, CONE.S.sigma) * reflected;
    }
    return { L: result.L / WHITE_POINT.L, M: result.M / WHITE_POINT.M, S: result.S / WHITE_POINT.S };
  }

  function lmsToRGB(L, M, S) {
    const X = 1.86006661 * L - 1.129771 * M + 0.219968 * S;
    const Y = 0.361122 * L + 0.638804 * M - 0.000008 * S;
    const Z = 1.089064 * S;
    const gamma = value => value <= 0.0031308 ? 12.92 * value : 1.055 * Math.pow(Math.max(value, 0), 1 / 2.4) - 0.055;
    const r = gamma(3.2406 * X - 1.5372 * Y - 0.4986 * Z);
    const g = gamma(-0.9689 * X + 1.8758 * Y + 0.0415 * Z);
    const b = gamma(0.0557 * X - 0.2040 * Y + 1.0570 * Z);
    const to255 = value => Math.round(clamp(value, 0, 1) * 255);
    return { r: to255(r), g: to255(g), b: to255(b) };
  }

  function wavelengthRGB(nm, fullBrightness = false) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else { r = 1; }
    let edge = 1;
    if (!fullBrightness && nm < 420) edge = 0.3 + 0.7 * (nm - 400) / 20;
    if (!fullBrightness && nm > 660) edge = 0.3 + 0.7 * (700 - nm) / 40;
    const tone = value => Math.round(255 * Math.pow(clamp(value * edge, 0, 1), .8));
    return { r: tone(r), g: tone(g), b: tone(b) };
  }

  const rgb = color => `rgb(${color.r},${color.g},${color.b})`;

  function hueName(nm) {
    if (nm < 450) return 'Violet';
    if (nm < 485) return 'Blue';
    if (nm < 500) return 'Cyan';
    if (nm < 565) return 'Green';
    if (nm < 590) return 'Yellow';
    if (nm < 625) return 'Orange';
    return 'Red';
  }

  function wavePath(x1, y1, x2, y2, amplitude, cycles, phase = 0) {
    const samples = 72;
    const dx = x2 - x1, dy = y2 - y1;
    const length = Math.hypot(dx, dy);
    const px = -dy / length, py = dx / length;
    let path = '';
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const offset = amplitude * Math.sin((Math.PI * 2 * cycles * t) + phase);
      const x = x1 + dx * t + px * offset;
      const y = y1 + dy * t + py * offset;
      path += `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)} `;
    }
    return path;
  }

  const byId = id => document.getElementById(id);
  const svgDefs = byId('svgDefs');
  const curvePlot = byId('curvePlot');

  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + .4;
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 100 + 34 * Math.cos(angle));
    line.setAttribute('y1', 145 + 34 * Math.sin(angle));
    line.setAttribute('x2', 100 + 47 * Math.cos(angle));
    line.setAttribute('y2', 145 + 47 * Math.sin(angle));
    byId('sunRays').appendChild(line);
  }

  const pigmentRays = byId('pigmentRays');
  const rayEls = RAYS.map((nm, index) => {
    const fadeId = `fade${index}`;
    const gradient = document.createElementNS(NS, 'linearGradient');
    gradient.setAttribute('id', fadeId);
    gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
    gradient.innerHTML = `<stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/><stop offset="50%" stop-color="#c0c0c8" stop-opacity=".45"/><stop offset="100%" stop-color="#707080" stop-opacity="0"/>`;
    svgDefs.appendChild(gradient);

    const absorbed = document.createElementNS(NS, 'path');
    absorbed.setAttribute('d', 'M210,300 L300,300');
    absorbed.setAttribute('stroke', `url(#${fadeId})`);
    absorbed.setAttribute('stroke-width', '2.2');
    absorbed.setAttribute('fill', 'none');
    pigmentRays.appendChild(absorbed);

    return { nm, absorbed, gradient };
  });

  const flowElements = [];
  function registerFlow(id, speed) {
    const element = byId(id);
    if (!element) return;
    flowElements.push({ element, speed });
  }
  ['sunStream1', 'sunStream2', 'sunStream3', 'rayS', 'rayM', 'rayL', 'selectedThroughPigment', 'beamToLens', 'beamIntoRetina', 'byS', 'byM', 'byL', 'rgM', 'rgL', 'bwS', 'bwM', 'bwL', 'somaInputBY', 'somaInputRG', 'somaInputBW', 'outputBY', 'outputRG', 'outputBW'].forEach((id, index) => registerFlow(id, 16 + (index % 3) * 3));

  const slider = byId('wlSlider');
  const refs = {
    sunBeam: byId('sunBeam'), sunBeamGradient: byId('sunBeamGradient'),
    sunStream1: byId('sunStream1'), sunStream2: byId('sunStream2'), sunStream3: byId('sunStream3'),
    selectedThroughPigment: byId('selectedThroughPigment'), beamToLens: byId('beamToLens'), beamIntoRetina: byId('beamIntoRetina'),
    rayS: byId('rayS'), rayM: byId('rayM'), rayL: byId('rayL'),
    byS: byId('byS'), byM: byId('byM'), byL: byId('byL'), rgM: byId('rgM'), rgL: byId('rgL'), bwS: byId('bwS'), bwM: byId('bwM'), bwL: byId('bwL'),
    coneS: byId('coneS'), coneM: byId('coneM'), coneL: byId('coneL'),
    somaInputBY: byId('somaInputBY'), somaInputRG: byId('somaInputRG'), somaInputBW: byId('somaInputBW'),
    byRing: byId('byRing'), byInner: byId('byInner'), rgRing: byId('rgRing'), rgInner: byId('rgInner'), bwRing: byId('bwRing'), bwInner: byId('bwInner'),
    outputBY: byId('outputBY'), outputRG: byId('outputRG'), outputBW: byId('outputBW'), brainGlow: byId('brainGlow'), glowStart: byId('glowStart'), glowEnd: byId('glowEnd'),
    wlVal: byId('wlVal')
  };

  let state = {
    exc: { L: 0, M: 0, S: 0 },
    norm: { L: 0, M: 0, S: 0 },
    op: { L: 0, M: 0, S: 0 },
    rg: 0, by: 0,
    byActive: false, rgActive: false, bwActive: true
  };

  function curveGeometry(dominant) {
    const x0 = 118, x1 = 370, y0 = 360;
    const center = (x0 + x1) / 2;
    const distanceFromCenter = Math.abs(dominant - 550) / 150;
    const halfWidth = 54 + 12 * (1 - distanceFromCenter);
    const height = 112 + 18 * (1 - distanceFromCenter);
    return { x0, x1, y0, center, halfWidth, height };
  }

  function pigmentY(nm) {
    return 332 - ((nm - 400) / 300) * 76;
  }

  function pigmentBounds(y, geometry) {
    const fraction = clamp((geometry.y0 - y) / geometry.height, .025, .995);
    const offset = geometry.halfWidth * Math.sqrt(-2 * Math.log(fraction));
    return {
      left: clamp(geometry.center - offset, geometry.x0, geometry.x1),
      right: clamp(geometry.center + offset, geometry.x0, geometry.x1)
    };
  }

  function drawCurve(dominant) {
    const geometry = curveGeometry(dominant);
    const { x0, x1, y0, center, halfWidth, height } = geometry;
    let area = `M${x0},${y0} `;
    let line = `M${x0},${y0} `;
    for (let x = x0; x <= x1; x += 3) {
      const y = y0 - height * Math.exp(-((x - center) ** 2) / (2 * halfWidth * halfWidth));
      area += `L${x.toFixed(1)},${y.toFixed(1)} `;
      line += `${x === x0 ? '' : 'L'}${x.toFixed(1)},${y.toFixed(1)} `;
    }
    area += `L${x1},${y0} Z`;
    const markerX = x0 + ((dominant - 400) / 300) * (x1 - x0);
    curvePlot.innerHTML = `<path d="${area}" fill="#242633" opacity=".4"/><path d="${line}" fill="none" stroke="#e0e0ea" stroke-width="2.2"/><line x1="${markerX.toFixed(1)}" y1="${y0 - height - 2}" x2="${markerX.toFixed(1)}" y2="${y0 + 1}" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 4" opacity=".95"/>`;
    return geometry;
  }

  function update() {
    const dominant = Number(slider.value);
    const exc = coneExcitations(dominant);

    // Per-cone activation normalization & thresholds
    const FLOOR = { S: 0.12, M: 0.18, L: 0.06 };
    const norm = {
      S: clamp(exc.S / CONE_MAX.S, 0, 1),
      M: clamp(exc.M / CONE_MAX.M, 0, 1),
      L: clamp(exc.L / CONE_MAX.L, 0, 1)
    };

    const sOn = norm.S > FLOOR.S;
    const mOn = norm.M > FLOOR.M;
    const lOn = norm.L > FLOOR.L;
    const sOp = sOn ? (norm.S - FLOOR.S) / (1 - FLOOR.S) : 0;
    const mOp = mOn ? (norm.M - FLOOR.M) / (1 - FLOOR.M) : 0;
    const lOp = lOn ? (norm.L - FLOOR.L) / (1 - FLOOR.L) : 0;

    const rg = exc.L - exc.M;
    const by = exc.S - (exc.L + exc.M) / 2;
    const rgN = clamp(rg * 2.4, -1, 1);
    const byN = clamp(by * 2.4, -1, 1);
    const outputRGColor = rgN >= 0 ? '#ee4c42' : '#49c85f';
    const outputBYColor = byN >= 0 ? '#3c74ff' : '#f2c14e';
    const valueLevel = clamp((exc.L + exc.M * 0.9 + exc.S * 0.2) / 1.5, 0.1, 1);

    // Channel activity to brain:
    // B/Y is suppressed at long red wavelengths (>620nm) where blue is dormant and yellow is redundant
    const byActive = dominant < 620 && (sOp > 0.05 || (dominant >= 540 && Math.abs(byN) > 0.2));
    const rgActive = Math.abs(rgN) > 0.08 && (lOn || mOn);
    const bwActive = valueLevel > 0.08;

    state = {
      exc, norm, op: { S: sOp, M: mOp, L: lOp },
      rg: rgN, by: byN,
      byActive, rgActive, bwActive
    };

    const geometry = drawCurve(dominant);

    // Calculate contact bounds along the pigment curve's left slope
    const topY = pigmentY(RAYS[RAYS.length - 1]);
    const bottomY = pigmentY(RAYS[0]);
    const topBounds = pigmentBounds(topY, geometry);
    const bottomBounds = pigmentBounds(bottomY, geometry);

    // Build the white beam polygon hugging the curve's left edge
    let beamPathD = `M120,132 L${topBounds.left.toFixed(1)},${topY.toFixed(1)} `;
    for (let y = topY + 8; y < bottomY; y += 8) {
      const b = pigmentBounds(y, geometry);
      beamPathD += `L${b.left.toFixed(1)},${y.toFixed(1)} `;
    }
    beamPathD += `L${bottomBounds.left.toFixed(1)},${bottomY.toFixed(1)} L116,168 Z`;
    refs.sunBeam.setAttribute('d', beamPathD);

    refs.sunBeamGradient.setAttribute('x1', '118');
    refs.sunBeamGradient.setAttribute('y1', '150');
    refs.sunBeamGradient.setAttribute('x2', ((topBounds.left + bottomBounds.left) / 2).toFixed(1));
    refs.sunBeamGradient.setAttribute('y2', ((topY + bottomY) / 2).toFixed(1));

    const midY = (topY + bottomY) / 2;
    const midBounds = pigmentBounds(midY, geometry);
    refs.sunStream1.setAttribute('d', wavePath(120, 138, topBounds.left, topY, 2.5, 3.2));
    refs.sunStream2.setAttribute('d', wavePath(124, 150, midBounds.left, midY, 2.5, 3.2));
    refs.sunStream3.setAttribute('d', wavePath(118, 162, bottomBounds.left, bottomY, 2.5, 3.2));

    // Selected dominant wavelength passing through the pigment (achromatic physical light)
    const selectedY = pigmentY(dominant);
    const selectedBounds = pigmentBounds(selectedY, geometry);
    refs.selectedThroughPigment.setAttribute('d', `M${(selectedBounds.left + 1).toFixed(1)},${selectedY.toFixed(1)} L${(selectedBounds.right - 1).toFixed(1)},${selectedY.toFixed(1)}`);
    refs.selectedThroughPigment.setAttribute('stroke', '#ffffff');
    refs.beamToLens.setAttribute('d', wavePath(selectedBounds.right, selectedY, 450, 276, 4, 2.2 + (700 - dominant) / 300 * 2.1));
    refs.beamIntoRetina.setAttribute('d', wavePath(482, 276, 514, 276, 2.5, 1.3 + (700 - dominant) / 300));
    refs.beamToLens.setAttribute('stroke', '#ffffff');
    refs.beamIntoRetina.setAttribute('stroke', '#ffffff');

    // Horizontal spectral rays inside pigment
    rayEls.forEach(ray => {
      const rayY = pigmentY(ray.nm);
      const bounds = pigmentBounds(rayY, geometry);
      const match = reflectance(ray.nm, dominant);
      ray.absorbed.setAttribute('d', `M${(bounds.left + 1).toFixed(1)},${rayY.toFixed(1)} L${(bounds.right - 1).toFixed(1)},${rayY.toFixed(1)}`);
      ray.absorbed.setAttribute('opacity', (.85 - .4 * match).toFixed(2));
      ray.gradient.setAttribute('x1', (bounds.left + 1).toFixed(1));
      ray.gradient.setAttribute('y1', rayY.toFixed(1));
      ray.gradient.setAttribute('x2', (bounds.right - 1).toFixed(1));
      ray.gradient.setAttribute('y2', rayY.toFixed(1));
    });

    // Dynamic Cone X-scaling based on activation (anchored at base x=24)
    const scaleS = { x: 1.0 + 0.45 * sOp, y: 1.0 + 0.15 * sOp };
    const scaleM = { x: 1.0 + 0.45 * mOp, y: 1.0 + 0.15 * mOp };
    const scaleL = { x: 1.0 + 0.45 * lOp, y: 1.0 + 0.15 * lOp };

    refs.coneS.setAttribute('transform', `translate(720,225) translate(24,0) scale(${scaleS.x.toFixed(2)},${scaleS.y.toFixed(2)}) translate(-24,0)`);
    refs.coneM.setAttribute('transform', `translate(720,276) translate(24,0) scale(${scaleM.x.toFixed(2)},${scaleM.y.toFixed(2)}) translate(-24,0)`);
    refs.coneL.setAttribute('transform', `translate(720,327) translate(24,0) scale(${scaleL.x.toFixed(2)},${scaleL.y.toFixed(2)}) translate(-24,0)`);

    // Cone tip X coordinates
    const tipS_X = 720 + 24 - 58 * scaleS.x;
    const tipM_X = 720 + 24 - 58 * scaleM.x;
    const tipL_X = 720 + 24 - 58 * scaleL.x;

    refs.rayS.setAttribute('d', `M514,276 C580,276 630,225 ${tipS_X.toFixed(1)},225`);
    refs.rayM.setAttribute('d', `M514,276 L${tipM_X.toFixed(1)},276`);
    refs.rayL.setAttribute('d', `M514,276 C580,276 630,327 ${tipL_X.toFixed(1)},327`);

    // Physical light in eye is achromatic white photons
    refs.rayS.setAttribute('stroke', '#ffffff');
    refs.rayM.setAttribute('stroke', '#ffffff');
    refs.rayL.setAttribute('stroke', '#ffffff');
    refs.rayS.setAttribute('opacity', (0.15 + 0.85 * sOp).toFixed(2));
    refs.rayM.setAttribute('opacity', (0.15 + 0.85 * mOp).toFixed(2));
    refs.rayL.setAttribute('opacity', (0.15 + 0.85 * lOp).toFixed(2));

    // Cone excitation appearance (Color begins here!)
    refs.coneS.querySelector('.cone-body').setAttribute('fill-opacity', sOn ? (0.6 + 0.4 * sOp).toFixed(2) : '0.22');
    refs.coneM.querySelector('.cone-body').setAttribute('fill-opacity', mOn ? (0.6 + 0.4 * mOp).toFixed(2) : '0.22');
    refs.coneL.querySelector('.cone-body').setAttribute('fill-opacity', lOn ? (0.6 + 0.4 * lOp).toFixed(2) : '0.22');

    refs.coneS.querySelector('.cone-body').setAttribute('stroke', sOn ? '#ffffff' : '#334055');
    refs.coneM.querySelector('.cone-body').setAttribute('stroke', mOn ? '#ffffff' : '#334055');
    refs.coneL.querySelector('.cone-body').setAttribute('stroke', lOn ? '#ffffff' : '#334055');

    // Cone → Opponent Neural Signal Lines (with Terminal Arrowheads)
    // S cone outputs (B/Y and White/Black only)
    refs.byS.setAttribute('opacity', sOp.toFixed(2));
    refs.bwS.setAttribute('opacity', (sOp * 0.35).toFixed(2));

    // M cone outputs (B/Y, R/G, White/Black)
    refs.byM.setAttribute('opacity', mOp.toFixed(2));
    refs.rgM.setAttribute('opacity', mOp.toFixed(2));
    refs.bwM.setAttribute('opacity', mOp.toFixed(2));

    // L cone outputs (B/Y, R/G, White/Black)
    refs.byL.setAttribute('opacity', lOp.toFixed(2));
    refs.rgL.setAttribute('opacity', lOp.toFixed(2));
    refs.bwL.setAttribute('opacity', lOp.toFixed(2));

    // Straight Hatched Lines entering Somata
    refs.somaInputBY.setAttribute('opacity', byActive ? (0.4 + 0.6 * Math.abs(byN)).toFixed(2) : '0.15');
    refs.somaInputBY.setAttribute('stroke', byN >= 0 ? '#3c74ff' : '#f2c14e');

    refs.somaInputRG.setAttribute('opacity', rgActive ? (0.4 + 0.6 * Math.abs(rgN)).toFixed(2) : '0.15');
    refs.somaInputRG.setAttribute('stroke', rgN >= 0 ? '#ee4c42' : '#49c85f');

    refs.somaInputBW.setAttribute('opacity', bwActive ? (0.35 + 0.65 * valueLevel).toFixed(2) : '0.15');

    // Opponent cell states (Center-Surround Receptive Field Opponency)
    if (byActive) {
      if (byN >= 0) {
        // Blue dominant: Yellow surround, Blue center
        refs.byRing.setAttribute('stroke', '#f2c14e');
        refs.byInner.setAttribute('fill', '#3c74ff');
      } else {
        // Yellow dominant: Blue surround, Yellow center
        refs.byRing.setAttribute('stroke', '#3c74ff');
        refs.byInner.setAttribute('fill', '#f2c14e');
      }
      refs.byInner.setAttribute('opacity', '1');
    } else {
      refs.byRing.setAttribute('stroke', '#222430');
      refs.byInner.setAttribute('fill', '#141620');
      refs.byInner.setAttribute('opacity', '0.25');
    }

    if (rgActive) {
      if (rgN >= 0) {
        // Red dominant: Red surround, Green center
        refs.rgRing.setAttribute('stroke', '#ee4c42');
        refs.rgInner.setAttribute('fill', '#49c85f');
      } else {
        // Green dominant: Green surround, Red center
        refs.rgRing.setAttribute('stroke', '#49c85f');
        refs.rgInner.setAttribute('fill', '#ee4c42');
      }
      refs.rgInner.setAttribute('opacity', '1');
    } else {
      refs.rgRing.setAttribute('stroke', '#222430');
      refs.rgInner.setAttribute('fill', '#141620');
      refs.rgInner.setAttribute('opacity', '0.25');
    }

    refs.bwRing.setAttribute('stroke', bwActive ? '#ffffff' : '#333540');
    refs.bwInner.setAttribute('stroke', bwActive ? (valueLevel > 0.4 ? '#ffffff' : '#666670') : '#222430');
    refs.bwInner.setAttribute('opacity', bwActive ? '1' : '0.3');

    // Biological Neural Transmission Tracts to Visual Cortex (Hatched Spike Trains)
    if (byActive) {
      refs.outputBY.setAttribute('stroke', outputBYColor);
      refs.outputBY.setAttribute('opacity', (0.4 + 0.6 * Math.abs(byN)).toFixed(2));
    } else {
      refs.outputBY.setAttribute('opacity', '0');
    }

    if (rgActive) {
      refs.outputRG.setAttribute('stroke', outputRGColor);
      refs.outputRG.setAttribute('opacity', (0.4 + 0.6 * Math.abs(rgN)).toFixed(2));
    } else {
      refs.outputRG.setAttribute('opacity', '0');
    }

    if (bwActive) {
      refs.outputBW.setAttribute('stroke', valueLevel > 0.5 ? '#eeeeec' : '#888892');
      refs.outputBW.setAttribute('opacity', (0.35 + 0.65 * valueLevel).toFixed(2));
    } else {
      refs.outputBW.setAttribute('opacity', '0');
    }

    // Brain glow percept
    const glowTint = rgb(wavelengthRGB(dominant, true));
    refs.glowStart.setAttribute('stop-color', glowTint);
    refs.glowEnd.setAttribute('stop-color', glowTint);
    refs.wlVal.textContent = `${dominant} nm · Wavelength (λ)`;
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(time) {
    const elapsed = time / 1000;
    flowElements.forEach(flow => {
      if (Number(flow.element.getAttribute('opacity') || 1) > 0.05) {
        flow.element.setAttribute('stroke-dashoffset', (-(elapsed * flow.speed) % 16).toFixed(1));
      }
    });

    const pulse = 0.8 + 0.2 * Math.sin(elapsed * 5);
    const { op, byActive, rgActive, bwActive, by, rg } = state;

    // Dynamic cone pulse reaction on X
    if (op.S > 0) {
      const scaleSX = 1.0 + (0.4 + 0.1 * Math.sin(elapsed * 6)) * op.S;
      refs.coneS.setAttribute('transform', `translate(720,225) translate(24,0) scale(${scaleSX.toFixed(2)},1.08) translate(-24,0)`);
    }
    if (op.M > 0) {
      const scaleMX = 1.0 + (0.4 + 0.1 * Math.sin(elapsed * 6)) * op.M;
      refs.coneM.setAttribute('transform', `translate(720,276) translate(24,0) scale(${scaleMX.toFixed(2)},1.08) translate(-24,0)`);
    }
    if (op.L > 0) {
      const scaleLX = 1.0 + (0.4 + 0.1 * Math.sin(elapsed * 6)) * op.L;
      refs.coneL.setAttribute('transform', `translate(720,327) translate(24,0) scale(${scaleLX.toFixed(2)},1.08) translate(-24,0)`);
    }

    if (byActive) {
      refs.byInner.setAttribute('r', (6 + 4 * Math.abs(by) * pulse).toFixed(1));
    }
    if (rgActive) {
      refs.rgInner.setAttribute('r', (6 + 4 * Math.abs(rg) * pulse).toFixed(1));
    }
    if (bwActive) {
      refs.bwInner.setAttribute('r', (5 + 3 * pulse).toFixed(1));
    }

    refs.brainGlow.setAttribute('r', (24 + 22 * ((state.exc.L + state.exc.M) / 2) + 4 * Math.sin(elapsed * 3)).toFixed(1));
    requestAnimationFrame(tick);
  }

  slider.addEventListener('input', update);
  update();
  if (!reduced) requestAnimationFrame(tick);
</script>
</body>
</html>
